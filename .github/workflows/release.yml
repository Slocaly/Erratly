name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Build
        run: |
          xcodebuild \
            -project Erratly.xcodeproj \
            -scheme Erratly \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/Erratly.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package
        run: |
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          cp -R "build/Build/Products/Release/Erratly.app" "$staging/"

          rm -f "$GITHUB_WORKSPACE/Erratly.dmg"
          create-dmg \
            --volname "Erratly" \
            --background "dmg-resources/background.png" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 128 \
            --icon "Erratly.app" 180 178 \
            --app-drop-link 480 178 \
            --no-internet-enable \
            "$GITHUB_WORKSPACE/Erratly.dmg" \
            "$staging" || test -f "$GITHUB_WORKSPACE/Erratly.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Erratly.dmg
          generate_release_notes: true
