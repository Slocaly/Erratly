name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-

      - name: Build
        run: |
          xcodebuild \
            -project Erratly.xcodeproj \
            -scheme Erratly \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/Erratly.app

      - name: Package
        run: |
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          cp -R "build/Build/Products/Release/Erratly.app" "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Erratly" -srcfolder "$staging" -ov -format UDZO "$GITHUB_WORKSPACE/Erratly.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Erratly.dmg
          generate_release_notes: true
